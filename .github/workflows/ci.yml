name: CI

on:
    schedule:
        - cron: "0 0 * * 1"
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    artifacts:
        name: "Artifacts"
        runs-on: ubuntu-22.04

        env:
            SPINE: pi3hat_spine
            SPINE_PATH: ./bazel-out/aarch64-opt/bin/spines/

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Install dependencies"
              run: |
                  sudo apt-get update
                  sudo apt-get install libncurses5

            - name: "Build pi3hat spine artifact"
              run: |
                  tools/bazelisk build --verbose_failures --config=pi64 //spines:pi3hat_spine

            - name: "Prepare artifacts directory"
              run: |
                  mkdir -p artifacts && mv ${{ env.SPINE_PATH }}${{ env.SPINE }} ./artifacts/

            - name: "Upload artifacts"
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.SPINE }}
                  path: ./artifacts

    build_linux:
        name: "Build on Linux"
        runs-on: ubuntu-22.04

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Set up Python"
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: "Build all targets"
              env:
                  BAZELISK_GITHUB_TOKEN: ${{ secrets.BAZELISK_GITHUB_TOKEN }}
              run: |
                  tools/bazelisk build --compilation_mode=fastbuild  //...

    build_raspi:
        name: "Cross-compile to the Raspberry Pi"
        runs-on: ubuntu-22.04

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Install dependencies"
              run: |
                  # See https://github.com/orgs/upkie/discussions/42
                  sudo apt-get update
                  sudo apt-get install libtinfo5

            - name: "Build Raspberry Pi targets"
              env:
                  BAZELISK_GITHUB_TOKEN: ${{ secrets.BAZELISK_GITHUB_TOKEN }}
              run: |
                  make build

    coverage:
        name: "Code coverage"
        runs-on: ubuntu-22.04

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.1
              with:
                  cache: true

            - name: "Run coverage tests"
              run: |
                  pixi run coverage

            - name: "Submit report to Coveralls"
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.github_token }}
                  file: ${{ github.workspace }}/bazel-out/_coverage/_coverage_report.dat
                  format: lcov

    lint:
        name: "Lint code"
        runs-on: ubuntu-22.04

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.1
              with:
                  cache: true

            - name: "Check code formatting"
              run: |
                  pixi run lint

    test-cpp:
        name: "Test C++ library on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-22.04, ubuntu-24.04]

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Install libtinfo5 for Ubuntu 24.04"
              if: matrix.os == 'ubuntu-24.04'
              run: |
                  # libtinfo5 was dropped in 24.04; pull it from the jammy
                  # universe pocket instead of pinning a specific .deb, whose
                  # older point releases get pruned from archive.ubuntu.com.
                  echo "deb http://archive.ubuntu.com/ubuntu jammy universe" | sudo tee /etc/apt/sources.list.d/jammy-universe.list
                  sudo apt-get update
                  sudo apt-get install -y libtinfo5
                  sudo rm /etc/apt/sources.list.d/jammy-universe.list
                  sudo apt-get update

            - name: "Run unit tests"
              run: |
                  tools/bazelisk test //upkie/...

    test-python:
        name: "Test Python library with ${{ matrix.pyenv }} on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest]
                pyenv: [py310, py311, py312, py313, py314]

        steps:
            - name: "Checkout sources"
              uses: actions/checkout@v4

            - name: "Setup Pixi"
              uses: prefix-dev/setup-pixi@v0.9.1
              with:
                  environments: test-${{ matrix.pyenv }}
                  cache: true

            - name: "Check unit tests"
              run: |
                  pixi run -e test-${{ matrix.pyenv }} _test-python-version

    ci_success:
        name: "CI success"
        runs-on: ubuntu-22.04

        needs:
            - artifacts
            - build_linux
            - build_raspi
            - coverage
            - lint
            - test-cpp
            - test-python

        steps:
            - run: echo "CI workflow completed successfully"
